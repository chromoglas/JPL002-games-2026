<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adjective Quiz 形容詞クイズ</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">
    <div class="lang-switch-box">
        <div class="lang-switch" id="lang-switch" role="group" aria-label="Language">
            <div class="lang-slider" aria-hidden="true"></div>
            <button class="lang-btn active" id="lang-en" type="button">EN</button>
            <button class="lang-btn" id="lang-ja" type="button">日</button>
        </div>
    </div>

    <div class="screens-container">

    <!-- Home Screen -->
    <div class="home-screen screen active bottom-anchored slide-up" id="home">
        <div class="screen-body">
            <h1 data-i18n="title"></h1>
            <div class="section-title" data-i18n="step1"></div>
            <div class="btn-group">
                <button class="mode-btn opt-item" data-val="all" data-i18n="stageAll"></button>
                <button class="mode-btn opt-item" data-val="stage1" data-i18n="stage1"></button>
                <button class="mode-btn opt-item" data-val="stage2" data-i18n="stage2"></button>
                <button class="mode-btn opt-item" data-val="stage3" data-i18n="stage3"></button>
                <button class="mode-btn opt-item" data-val="stage4" data-i18n="stage4"></button>
            </div>
            <div class="step-section" id="step1-section">
                <div class="section-title" data-i18n="step2"></div>
                <div class="btn-group" id="base-mode-group">
                    <button class="mode-btn base-mode" data-val="study" data-i18n="modeStudy"></button>
                    <button class="mode-btn base-mode" data-val="challenge" data-i18n="modeChallenge"></button>
                </div>
            </div>
        </div>
        <div class="screen-footer">
            <button class="start-btn" id="start-quiz" data-i18n="startBtn" disabled></button>
        </div>
    </div>

    <!-- Quiz Screen -->
    <div class="quiz-screen screen bottom-anchored slide-up" id="quiz-page">
        <div class="screen-body">
            <div class="card">
                <div class="score-row">
                    <div class="score-right">
                        <div class="progress-text" id="progress-area" style="display:none"></div>
                        <div class="timer-text" id="timer-area"></div>
                    </div>
                    <span class="score-group"><span data-i18n="scoreText"></span><span id="score-num">0</span></span>
                </div>
                <div class="progress-bar" id="progress-bar">
                    <div class="progress-fill fill-blue" id="progress-fill"></div>
                </div>
                <div class="q-box" id="question-area"></div>
                <input id="ans-input" placeholder="Answer here...">
                <div class="feed-box">
                    <div id="feed-area" data-i18n="inputTip"></div>
                </div>
                <div class="action-row" id="action-row">
                    <button id="skip-btn" data-i18n="skipBtn"></button>
                    <button id="action-btn" data-i18n="checkBtn"></button>
                </div>
            </div>
        </div>
        <div class="screen-footer">
            <div class="bottom-btn-group">
                <button class="back-home" onclick="backToHome()" data-i18n="backBtn"></button>
                <button class="end-session-btn" onclick="showSummary()" data-i18n="endSessionBtn"></button>
            </div>
        </div>
    </div>

    <!-- Summary Screen -->
    <div class="summary-screen screen bottom-anchored slide-up" id="summary-page">
        <div class="screen-body">
            <div class="card">
                <div class="summary-title" data-i18n="summaryTitle"></div>
                <div class="summary-stat-line">
                    <span data-i18n="sumAttempt"></span><span id="sumAttemptNum"></span>
                    &nbsp;&nbsp;
                    <span data-i18n="sumCorrect"></span><span id="sumCorrectNum"></span>
                    &nbsp;&nbsp;
                    <span data-i18n="sumWrong"></span><span id="sumWrongNum"></span>
                    &nbsp;&nbsp;
                    <span data-i18n="sumScore"></span><span id="sumScoreNum"></span>
                </div>
                <h3 style="margin:24px 0 10px" data-i18n="mistakeHeader"></h3>
                <table class="mistake-table" id="mistakeTableWrap">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th data-i18n="tblEn"></th>
                            <th data-i18n="tblQuestion"></th>
                            <th data-i18n="tblAnswer"></th>
                            <th data-i18n="tblUserAns"></th>
                        </tr>
                    </thead>
                    <tbody id="mistakeTableBody"></tbody>
                </table>
            </div>
        </div>
        <div class="screen-footer">
            <div class="summary-btn-group">
                <button class="back-home" onclick="backToHome()" data-i18n="backBtn"></button>
            </div>
        </div>
    </div>

    </div>
</div>

<!-- 全局彩条层：fixed 定位覆盖整个视口，进入 summary 时飘落，退出时淡出清除 -->
<div class="confetti-layer" id="confetti-layer"></div>

<!-- 动态加载 JS：每次刷新自动生成时间戳（?t=…）附加到路径后，避免浏览器缓存旧文件导致代码更新后看不到效果；无需再手动维护版本号 -->
<script>
    (function() {
        var t = new Date().getTime();
        document.write('<script src="js/lang.js?t=' + t + '"><\/script>');
        document.write('<script src="js/data.js?t=' + t + '"><\/script>');
        document.write('<script src="js/main.js?t=' + t + '"><\/script>');
    })();
</script>
</body>
</html>
