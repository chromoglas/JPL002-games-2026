<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adjective Quiz 形容詞クイズ</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Noto Sans JP", sans-serif;
        }
        body {
            background-color: #f7f8fc;
            padding: 40px 20px;
        }
        .wrap {
            max-width: 900px;
            margin: 0 auto;
        }
        .lang-switch-box {
            text-align: right;
            margin-bottom:20px;
        }
        .lang-btn {
            padding:8px 16px;
            font-size:16px;
            border-radius:6px;
            border:1px solid #3b82f6;
            background:#fff;
            color:#3b82f6;
            cursor:pointer;
            margin-left:8px;
        }
        .lang-btn.active {
            background:#3b82f6;
            color:#fff;
        }
        .home-screen {
            display: block;
        }
        .quiz-screen {
            display: none;
        }
        .summary-screen {
            display: none;
        }
        h1 {
            text-align: center;
            font-size: 38px;
            color: #222;
            margin-bottom: 40px;
        }
        .section-title {
            font-size: 24px;
            margin: 30px 0 16px;
            color: #333;
        }
        .btn-group {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .mode-btn {
            padding: 14px 24px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            background: #e2e8f0;
            cursor: pointer;
        }
        .mode-btn.active {
            background: #3b82f6;
            color: white;
        }
        .start-btn {
            width: 100%;
            padding: 18px;
            font-size: 22px;
            margin-top: 40px;
            border: none;
            border-radius: 10px;
            background: #10b981;
            color: white;
            cursor: pointer;
        }
        .card {
            background: white;
            padding: 36px 30px;
            border-radius: 12;
            box-shadow: 0 2px 14px #e0e5ef;
        }
        .score-row {
            display: flex;
            justify-content: space-between;
            font-size: 24px;
            margin-bottom: 30px;
        }
        .timer-text {
            color: #ef4444;
            font-weight: bold;
        }
        .q-box {
            background: #edf2fb;
            padding: 30px 20px;
            border-radius: 10px;
            font-size: 26px;
            text-align: center;
            margin-bottom: 10px;
            line-height: 1.8;
        }
        .input-tip {
            font-size: 16px;
            color:#666;
            margin-bottom:12px;
        }
        #ans-input {
            width: 100%;
            padding: 16px 14px;
            font-size: 20px;
            border: 1px solid #bbb;
            border-radius: 8px;
            margin-bottom: 24px;
        }
        .operate-buttons {
            display: flex;
            gap: 16px;
        }
        #skip-btn {
            width: 140px;
            padding: 16px;
            font-size: 20px;
            border: 1px solid #999;
            border-radius: 8px;
            background: #fff;
            cursor: pointer;
        }
        #check-btn {
            flex: 1;
            padding: 16px;
            font-size: 20px;
            border: none;
            border-radius: 8px;
            background: #22c55e;
            color: white;
            cursor: pointer;
        }
        #continue-btn {
            width: 100%;
            padding: 16px;
            font-size: 20px;
            border: none;
            border-radius: 8px;
            background: #64748b;
            color: white;
            cursor: pointer;
            display:none;
        }
        .feedback {
            margin-top: 28px;
            font-size: 20px;
            font-weight: normal;
            color:#dc2626;
        }
        .feedback.correct-text{
            color:#16a34a;
        }
        .note-text {
            margin-top:12px;
            font-size:18px;
            color:#d97706;
        }
        .bottom-btn-group {
            display:flex;
            gap:12px;
            margin-top:30px;
        }
        .back-home {
            flex:1;
            padding: 12px;
            font-size: 18px;
            border: 1px solid #999;
            border-radius: 8px;
            background: white;
            cursor: pointer;
        }
        .end-session-btn {
            flex:1;
            padding:12px;
            font-size:18px;
            border:none;
            border-radius:8px;
            background:#dc2626;
            color:#fff;
            cursor:pointer;
        }
        .summary-title{
            font-size:28px;
            margin-bottom:24px;
        }
        .summary-stat-line{
            font-size:22px;
            margin:8px 0;
        }
        .mistake-table{
            width:100%;
            border-collapse: collapse;
            margin:24px 0;
        }
        .mistake-table th,.mistake-table td{
            border:1px solid #ddd;
            padding:10px;
            font-size:17px;
            text-align:center;
        }
        .mistake-table th{
            background:#f3f4f6;
        }
        .summary-btn-group{
            display:flex;
            gap:16px;
            margin-top:20px;
        }
        .practice-mistake-btn{
            flex:1;
            padding:12px;
            font-size:18px;
            border:none;
            border-radius:8px;
            background:#64748b;
            color:#fff;
            cursor:pointer;
        }
    </style>
</head>

            <button class="mode-btn opt-item" data-val="stage2" data-i18n="stage2"></button>

            <button class="mode-btn opt-item" data-val="neg" data-i18n="gNeg"></button>
            <button class="mode-btn opt-item" data-val="past" data-i18n="gPast"></button>

            <button class="mode-btn opt-item" data-val="kedo" data-i18n="gKedo"></button>

        <div class="btn-group opt-diff opt-panel" style="display:none;">

        </div>

        <button class="start-btn" id="start-quiz" data-i18n="startBtn"></button>
    </div>

    <div class="quiz-screen" id="quiz-page">
        <div class="card">
            <div class="score-row">
                <span data-i18n="scoreText"></span><span id="score-num">0</span>
                <div class="timer-text" id="timer-area"></div>
            </div>
            <div class="q-box" id="question-area"></div>
            <div class="input-tip" data-i18n="inputTip"></div>
            <input id="ans-input">
            <div class="operate-buttons" id="doubleBtns">
                <button id="skip-btn" data-i18n="skipBtn"></button>
                <button id="check-btn" data-i18n="checkBtn"></button>
            </div>
            <button id="continue-btn" data-i18n="continueBtn"></button>
            <div class="feedback" id="feed-text"></div>
            <div class="note-text" id="note-area"></div>
            <div class="bottom-btn-group">

                <button class="end-session-btn" onclick="showSummary()" data-i18n="endSessionBtn"></button>
            </div>
        </div>
    </div>

    <div class="summary-screen card" id="summary-page">

        <div class="summary-stat-line">

            &nbsp;&nbsp;
            <span data-i18n="sumCorrect"></span><span id="sumCorrectNum"></span>
            &nbsp;&nbsp;
            <span data-i18n="sumWrong"></span><span id="sumWrongNum"></span>
            &nbsp;&nbsp;
            <span data-i18n="sumScore"></span><span id="sumScoreNum"></span>

            <thead>

                    <th data-i18n="tblQuestion"></th>
                    <th data-i18n="tblAnswer"></th>
                    <th data-i18n="tblUserAns"></th>
                </tr>
            </thead>
            <tbody id="mistakeTableBody">

        </table>

        <div class="summary-btn-group">
            <button class="practice-mistake-btn" id="practiceMistakeBtn" data-i18n="practiceMistakeBtn"></button>

        </div>
    </div>
</div>

function removeSolvedMistake(enText) {
    mistakeRecordList = mistakeRecordList.filter(item => item.questionText !== enText);
}

function renderLang(){
    const dict = langData[currentLang];
    document.querySelectorAll("[data-i18n]").forEach(el=>{
        const key = el.getAttribute("data-i18n");
        el.innerText = dict[key];
    })
    if(currentQ){
        if(currentLang === "ja"){
            document.getElementById("question-area").innerText = `意味：${currentQ.en}`;
        }else{
            document.getElementById("question-area").innerText = `Meaning: ${currentQ.en}`;
        }
        refreshTimerText();
        if(questionResultShown){
            refreshFeedbackText();
        }
    }
    document.getElementById("lang-ja").classList.toggle("active", currentLang==="ja");
    document.getElementById("lang-en").classList.toggle("active", currentLang==="en");
}

function refreshTimerText(){
    if(baseMode === "challenge"){
        const dict = langData[currentLang];
        document.getElementById("timer-area").innerText = `${dict.timerLabel}${remainTime}s`;
    }
}

function refreshFeedbackText(){
    const feedDom = document.getElementById("feed-text");
    const dict = langData[currentLang];
    if(feedDom.classList.contains("correct-text")){
        feedDom.innerText = dict.correctMsg;
    }else{
        if(feedDom.innerText.startsWith(dict.timeOver)){
            feedDom.innerText = `${dict.timeOver}${currentQ.jp}`;
        }else{
            feedDom.innerText = `${dict.wrongMsg}${currentQ.jp}`;
        }
    }
}

function shuffleArray(arr) {
    const copy = [...arr];
    for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
}

function getFilteredFullPool() {
    if(practiceMistakeMode){
        return shuffleArray([...mistakeQuestionPool]);
    }
    let list = [...fullBank];
    if(sortMain === "lesson") {
        const sNum = parseInt(subOpt.replace("stage",""));
        list = list.filter(item => item.stage === sNum);
    } else if(sortMain === "grammar") {
        list = list.filter(item => item.type === subOpt);
    } else if(sortMain === "diff") {
        if(subOpt === "easy") list = list.filter(item => item.diff === "easy");
    }
    if(!hasTokuiAppeared){
        let tokuiItems = list.filter(x=>x.base==="とくい");
        let otherItems = list.filter(x=>x.base!=="にがて");
        list = [...tokuiItems, ...shuffleArray(otherItems)];
    }
    return shuffleArray(list);
}

function pickNextQuestion() {
    if(fullFilterPool.length <= 0) {
        fullFilterPool = getFilteredFullPool();
    }
    const q = fullFilterPool.shift();
    if(q.base === "とくい") hasTokuiAppeared = true;
    return q;
}

function loadNewQuestion() {
    clearInterval(timerId);
    currentQ = pickNextQuestion();
    questionResultShown = false;
    const dict = langData[currentLang];
    if(currentLang === "ja"){
        document.getElementById("question-area").innerText = `意味：${currentQ.en}`;
    }else{
        document.getElementById("question-area").innerText = `Meaning: ${currentQ.en}`;
    }
    document.getElementById("ans-input").value = "";
    document.getElementById("feed-text").innerText = "";
    document.getElementById("feed-text").className = "feedback";
    document.getElementById("note-area").innerText = "";
    document.getElementById("doubleBtns").style.display="flex";
    document.getElementById("continue-btn").style.display="none";
    const timerDom = document.getElementById("timer-area");
    if(baseMode === "challenge") {
        remainTime = 20;
        startTimer();
    }else{
        timerDom.innerText = "";
    }
}

function startTimer() {
    clearInterval(timerId);
    refreshTimerText();
    timerId = setInterval(()=>{
        remainTime--;
        refreshTimerText();
        if(remainTime <= 0) {
            clearInterval(timerId);
            showAnswer(true);
        }
    },1000);
}

function showAnswer(isTimeout=false){
    const feedDom = document.getElementById("feed-text");
    const dict = langData[currentLang];
    feedDom.className = "feedback";
    if(isTimeout){
        feedDom.innerText = `${dict.timeOver}${currentQ.jp}`;
    }else{
        feedDom.innerText = `${dict.wrongMsg}${currentQ.jp}`;
    }
    questionResultShown = true;
    if(!practiceMistakeMode){
        const alreadyExist = mistakeRecordList.some(r=>r.questionText === currentQ.en);
        if(!alreadyExist){
            wrongCount++;
            attemptCount++;
            mistakeRecordList.push({
                en: currentQ.en,
                questionText: currentQ.en,
                correctAns: currentQ.jp,
                userAns: document.getElementById("ans-input").value.trim()
            });
        }
    }
    if(currentQ.needNote){
        document.getElementById("note-area").innerText = dict.noteTokui;
    }
    document.getElementById("doubleBtns").style.display="none";
    document.getElementById("continue-btn").style.display="block";
}

document.getElementById("check-btn").onclick = function(){
    const userInput = document.getElementById("ans-input").value.trim();
    if(userInput === "") return;
    clearInterval(timerId);
    const feedDom = document.getElementById("feed-text");
    const noteDom = document.getElementById("note-area");
    const dict = langData[currentLang];
    noteDom.innerText = "";
    if(!practiceMistakeMode) attemptCount++;
    if(userInput === currentQ.jp) {
        score += 10;
        document.getElementById("score-num").innerText = score;
        feedDom.innerText = dict.correctMsg;
        feedDom.className = "feedback correct-text";
        questionResultShown = true;
        // 错题练习答对：1.从练习池移除 2.从原始错题记录移除（汇总不再显示）
        if(practiceMistakeMode){
            mistakeQuestionPool = mistakeQuestionPool.filter(item=>item.en !== currentQ.en);
            removeSolvedMistake(currentQ.en);
        }
    }else{
        if(!practiceMistakeMode){
            const alreadyExist = mistakeRecordList.some(r=>r.questionText === currentQ.en);
            if(!alreadyExist){
                mistakeRecordList.push({
                    en: currentQ.en,
                    questionText: currentQ.en,
                    correctAns: currentQ.jp,
                    userAns: userInput
                });
            }
        }
        showAnswer(false);
        return;
    }
    document.getElementById("doubleBtns").style.display="none";
    document.getElementById("continue-btn").style.display="block";
}

document.getElementById("skip-btn").onclick = function(){
    clearInterval(timerId);
    const userInput = document.getElementById("ans-input").value.trim();
    if(!practiceMistakeMode){
        const alreadyExist = mistakeRecordList.some(r=>r.questionText === currentQ.en);
        if(!alreadyExist){
            mistakeRecordList.push({
                en: currentQ.en,
                questionText: currentQ.en,
                correctAns: currentQ.jp,
                userAns: userInput || "(SKIP)"
            });
        }
    }
    showAnswer(false);
}

document.getElementById("continue-btn").onclick = function(){
    loadNewQuestion();
}

function backToHome(){
    clearInterval(timerId);
    document.getElementById("home").style.display = "block";
    document.getElementById("quiz-page").style.display = "none";
    document.getElementById("summary-page").style.display = "none";
    document.querySelectorAll(".mode-btn").forEach(b=>b.classList.remove("active"));
    document.querySelectorAll(".opt-panel").forEach(p=>p.style.display="none");
    baseMode = null; sortMain = null; subOpt = null;
    fullFilterPool = [];
    score = 0; attemptCount=0; correctCount=0; wrongCount=0;
    hasTokuiAppeared = false;
    mistakeRecordList = [];
    mistakeQuestionPool = [];
    practiceMistakeMode = false;
    questionResultShown = false;
}

function showSummary(){
    clearInterval(timerId);
    document.getElementById("quiz-page").style.display="none";
    document.getElementById("summary-page").style.display="block";
    document.getElementById("sumAttemptNum").innerText = attemptCount;
    document.getElementById("sumCorrectNum").innerText = correctCount;
    document.getElementById("sumWrongNum").innerText = wrongCount;
    document.getElementById("sumScoreNum").innerText = score;
    const tbody = document.getElementById("mistakeTableBody");
    tbody.innerHTML = "";
    mistakeRecordList.forEach((item,idx)=>{
        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td>${idx+1}</td>
            <td>${item.en}</td>
            <td>${item.questionText}</td>
            <td>${item.correctAns}</td>
            <td>${item.userAns}</td>
        `;
        tbody.appendChild(tr);
    });
}

document.getElementById("practiceMistakeBtn").onclick = function(){
    if(mistakeRecordList.length === 0){
        alert(currentLang==="ja"?"ミスした問題はありません":"No mistakes in this session");
        return;
    }
    practiceMistakeMode = true;
    document.getElementById("summary-page").style.display="none";
    document.getElementById("quiz-page").style.display="block";
    // 转换原始错题记录为标准题目对象
    mistakeQuestionPool = mistakeRecordList.map(item=>{
        return {
            en: item.en,
            jp: item.correctAns
        };
    })
    fullFilterPool = shuffleArray([...mistakeQuestionPool]);
    loadNewQuestion();
}

document.addEventListener("DOMContentLoaded", function(){
    document.getElementById("lang-ja").onclick = ()=>{currentLang="ja";renderLang();};
    document.getElementById("lang-en").onclick = ()=>{currentLang="en";renderLang();};

    document.querySelectorAll(".base-mode").forEach(btn=>{
        btn.onclick = ()=>{
            document.querySelectorAll(".base-mode").forEach(b=>b.classList.remove("active"));
            btn.classList.add("active");
            baseMode = btn.dataset.val;
        }
    })
    document.querySelectorAll(".sort-type").forEach(btn=>{
        btn.onclick = ()=>{
            document.querySelectorAll(".sort-type").forEach(b=>b.classList.remove("active"));
            btn.classList.add("active");
            sortMain = btn.dataset.val;
            document.querySelectorAll(".opt-panel").forEach(p=>p.style.display="none");
            if(sortMain === "lesson"){
                document.querySelector(".opt-lesson").style.display="flex";
            }else if(sortMain === "grammar"){
                document.querySelector(".opt-grammar").style.display="flex";
            }else if(sortMain === "diff"){
                document.querySelector(".opt-diff").style.display="flex";
            }
            subOpt = null;
            document.querySelectorAll(".opt-item").forEach(o=>o.classList.remove("active"));
        }
    })
    document.querySelectorAll(".opt-item").forEach(btn=>{
        btn.onclick = ()=>{
            const parent = btn.parentElement;
            parent.querySelectorAll(".opt-item").forEach(b=>b.classList.remove("active"));
            btn.classList.add("active");
            subOpt = btn.dataset.val;
        }
    })

    document.getElementById("start-quiz").onclick = function(){
        if(!baseMode || !sortMain || !subOpt){
            const dict = langData[currentLang];
            alert(currentLang==="ja"?"モード・区分・オプションをすべて選択してください":"Please select mode, category and detail options first");
            return;
        }
        document.getElementById("home").style.display = "none";
        document.getElementById("quiz-page").style.display = "block";
        document.getElementById("summary-page").style.display = "none";
        score = 0; attemptCount=0; correctCount=0; wrongCount=0;
        mistakeRecordList = [];
        mistakeQuestionPool = [];
        practiceMistakeMode = false;
        fullFilterPool = [];
        hasTokuiAppeared = false;
        questionResultShown = false;
        document.getElementById("score-num").innerText = score;
        loadNewQuestion();
    }

    document.getElementById("ans-input").addEventListener("keydown", e=>{
        if(e.key === "Enter") e.preventDefault();
    })

    renderLang();
})
</script>
